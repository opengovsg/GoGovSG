name: 'Setup and install'
description: 'Common setup steps for CI jobs (Node.js + pnpm install)'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'

    - shell: bash
      run: pnpm install --frozen-lockfile
