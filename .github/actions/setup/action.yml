name: 'Setup and install'
description: 'Common setup steps for CI jobs (Node.js + pnpm install)'

inputs:
  node-version:
    description: >-
      Node version to use, overriding package.json's engines.node. Only
      needed for tooling (e.g. oxlint/oxfmt) that requires a newer Node
      than the app itself targets.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: 'package.json'
        cache: 'pnpm'

    - shell: bash
      run: pnpm install --frozen-lockfile
