name: Deploy to production

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  release:
    types:
      - released

jobs:
  build-and-deploy:
    name: ${{ matrix.variant.name }}
    strategy:
      matrix:
        variant:
          - name: gogov
            asset_variant: gov
            dd_service: go-gov
            serverless_service: gogovsg
            eb_env: go-production
            lambda_domain: go.gov.sg
            lambda_eb_callback_endpoint: https://go.gov.sg/api/callback/qr
            use_existing_version: false
          - name: edu
            asset_variant: edu
            dd_service: go-edu
            serverless_service: edu
            eb_env: edu-production
            lambda_domain: for.edu.sg
            lambda_eb_callback_endpoint: https://for.edu.sg/api/callback/qr
            use_existing_version: true
          - name: health
            asset_variant: health
            dd_service: go-health
            serverless_service: health
            eb_env: health-production
            lambda_domain: for.sg
            lambda_eb_callback_endpoint: https://for.sg/api/callback/qr
            use_existing_version: true
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      asset_variant: ${{ matrix.variant.asset_variant }}
      dd_service: ${{ matrix.variant.dd_service }}
      serverless_service: ${{ matrix.variant.serverless_service }}
      eb_app: gosg-production
      eb_env: ${{ matrix.variant.eb_env }}
      branch_env: production
      use_existing_version: ${{ matrix.variant.use_existing_version }}
      lambda_asset_variant: ${{ matrix.variant.asset_variant }}
      lambda_domain: ${{ matrix.variant.lambda_domain }}
      lambda_eb_callback_endpoint: ${{ matrix.variant.lambda_eb_callback_endpoint }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
