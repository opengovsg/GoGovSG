name: Deploy to staging

permissions:
  contents: read

on:
  push:
    branches:
      - 'staging'

jobs:
  build-and-deploy:
    name: ${{ matrix.variant.name }}
    strategy:
      matrix:
        variant:
          - name: gogov
            asset_variant: gov
            dd_service: go-gov
            serverless_service: gogovsg
            eb_env: go-staging
            domain: staging.go.gov.sg
            eb_callback_endpoint: https://staging.go.gov.sg/api/callback/qr
            use_existing_version: false
          - name: edu
            asset_variant: edu
            dd_service: go-edu
            serverless_service: edu
            eb_env: edu-staging
            domain: staging.for.edu.sg
            eb_callback_endpoint: https://staging.for.edu.sg/api/callback/qr
            use_existing_version: true
          - name: health
            asset_variant: health
            dd_service: go-health
            serverless_service: health
            eb_env: health-staging
            domain: staging.for.sg
            eb_callback_endpoint: https://staging.for.sg/api/callback/qr
            use_existing_version: true
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      asset_variant: ${{ matrix.variant.asset_variant }}
      dd_service: ${{ matrix.variant.dd_service }}
      serverless_service: ${{ matrix.variant.serverless_service }}
      eb_app: gosg-stag
      eb_env: ${{ matrix.variant.eb_env }}
      branch_env: staging
      use_existing_version: ${{ matrix.variant.use_existing_version }}
      domain: ${{ matrix.variant.domain }}
      eb_callback_endpoint: ${{ matrix.variant.eb_callback_endpoint }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
