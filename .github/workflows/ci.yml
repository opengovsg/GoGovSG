name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - staging
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          ASSET_VARIANT: gov

  supply-chain:
    name: Supply Chain Verification
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      # lockfile-lint doesn't understand pnpm-lock.yaml's format (only npm/yarn) --
      # pnpm's own signature verification is the native equivalent.
      - uses: ./.github/actions/setup
      - name: Verify registry signatures
        run: pnpm audit signatures
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  playwright:
    name: End To End Tests (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    # actions/cache needs write to save browser binaries between runs.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      # Do not inject CLOUDMERSIVE_KEY here. Live virus scans flake under the
      # 3-browser matrix (rate limits / timeouts / allowInvalidFiles on NUL
      # fixtures), which leaves the create-link modal open and cascades into
      # filter/directory failures. The malicious-file e2e test is skipped;
      # without a key CloudmersiveScanService no-ops like integration tests.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run dev &
      - run: sleep 270
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test:integration
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}
