name: ci
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - staging
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      # oxlint (and oxlint-plugin-eslint) require Node ^20.19.0 || >=22.12.0,
      # newer than this app's own Node 18 target -- CI-tooling-only override.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      # oxfmt requires Node ^20.19.0 || >=22.12.0, newer than this app's own
      # Node 18 target -- CI-tooling-only override.
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          ASSET_VARIANT: gov

  audit-signatures:
    name: Audit Signatures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      # lockfile-lint doesn't understand pnpm-lock.yaml's format (only npm/yarn) --
      # pnpm's own signature verification is the native equivalent.
      - uses: ./.github/actions/setup
      - run: pnpm audit signatures

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  testcafe:
    name: End To End Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - run: echo CLOUDMERSIVE_KEY=${{secrets.CLOUDMERSIVE_KEY}} >> .env
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test:e2e-headless
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}

  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/setup
      - run: pnpm run dev &
      - run: sleep 270
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test:integration
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }}
