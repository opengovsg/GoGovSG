name: ci
on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - run: pnpm run build
        env:
          ASSET_VARIANT: gov

  supply-chain:
    name: Supply Chain Verification
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      # lockfile-lint doesn't understand pnpm-lock.yaml's format (only npm/yarn) --
      # pnpm's own signature verification is the native equivalent.
      - uses: ./.github/actions/setup
      - name: Verify registry signatures
        run: pnpm audit signatures
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        # Non-blocking: this action installs dd-trace from the npm registry, so
        # a registry hiccup fails it for reasons unrelated to the code under test
        # Telemetry failure is not worth blocking the suite.
        continue-on-error: true
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test
        env:
          NODE_OPTIONS: ${{ env.DD_TRACE_PACKAGE && format('-r {0}', env.DD_TRACE_PACKAGE) || '' }}

  playwright:
    name: End To End Tests (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      # Do not inject CLOUDMERSIVE_KEY here. Live virus scans flake under the
      # 3-browser matrix (rate limits / timeouts / allowInvalidFiles on NUL
      # fixtures), which leaves the create-link modal open and cascades into
      # filter/directory failures. The malicious-file e2e test is skipped;
      # without a key CloudmersiveScanService no-ops like integration tests.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Configure Datadog Test Visibility
        # Non-blocking: this action installs dd-trace from the npm registry, so
        # a registry hiccup fails it for reasons unrelated to the code under test
        # Telemetry failure is not worth blocking the suite.
        continue-on-error: true
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
        env:
          NODE_OPTIONS: ${{ env.DD_TRACE_PACKAGE && format('-r {0}', env.DD_TRACE_PACKAGE) || '' }}
      # Traces, screenshots, videos and the per-failure page snapshot. Without
      # these, a CI-only flake can only be investigated by pushing a commit and
      # reading stdout.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: ./.github/actions/setup
      - name: Start the stack
        # server-only: this suite drives the API directly and never loads a
        # page, so the webpack dev server would only cost a compile and then
        # contend for CPU with the tests.
        run: pnpm run dev:server-only &
      - name: Wait for the stack to accept requests
        # Replaces a blind `sleep 270` that cost the full 270s even though the
        # stack is usually serving well inside 120s, and that reported a
        # not-yet-ready stack as a confusing test failure rather than as a
        # startup timeout.
        #
        # Any HTTP status means the listener is up: these routes are
        # auth-guarded, so a 401 proves readiness as well as a 200 does.
        # Postgres needs no probe of its own -- Express runs sequelize.sync at
        # boot, so it cannot answer before the database is reachable.
        run: |
          set -uo pipefail
          # Without -f, curl exits 0 for any HTTP response and non-zero only
          # when it could not get one, which is exactly the distinction we want.
          listening() {
            curl -s -o /dev/null -m 5 "$1"
          }
          deadline=$((SECONDS + 300))
          until listening http://localhost:8080/api/user/message \
            && listening http://localhost:1080/email \
            && listening http://localhost:4566/local-bucket; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::stack was still not serving after 300s"
              exit 1
            fi
            sleep 3
          done
          echo "stack ready after ${SECONDS}s"
      - name: Configure Datadog Test Visibility
        # Non-blocking: this action installs dd-trace from the npm registry, so
        # a registry hiccup fails it for reasons unrelated to the code under test
        # Telemetry failure is not worth blocking the suite.
        continue-on-error: true
        uses: datadog/test-visibility-github-action@cdf298ef8277c8c3bec321499084ce5d9e4ff1e8 # v2.10.0
        with:
          languages: js
          service: gogovsg
          api_key: ${{ secrets.DD_API_KEY }}
      - run: pnpm run test:integration
        env:
          NODE_OPTIONS: ${{ env.DD_TRACE_PACKAGE && format('-r {0}', env.DD_TRACE_PACKAGE) || '' }}
      # Without these, a stack that fails to boot leaves nothing to diagnose it
      # with: the readiness gate above only reports that it never came up.
      - if: failure()
        run: docker compose -f docker-compose.yml logs --tail=200
