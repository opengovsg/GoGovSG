# Serves a prebuilt client bundle instead of running webpack-dev-server.
#
# The e2e suite gives every test a fresh browser context, so all 47 of them load
# the bundle on a cold HTTP cache. Measured: 27.15 MB in development with an
# inline source map, against 3.51 MB minified -- 7.7x, paid 47 times over.
#
#   pnpm run dev:e2e
#
# `dist` is built on the host and mounted, rather than built in the container,
# because the host already has node_modules installed and does it in ~30s.
#
# NODE_ENV stays `development`, inherited from the base file, and that is
# load-bearing rather than incidental: src/server/config.ts only leaves cookies
# insecure (required over http://localhost), disables the OTP rate limit and
# sets nodemailer's ignoreTLS for maildev in development, and
# src/server/models/index.ts only runs sequelize.sync there, so a production
# NODE_ENV would leave the suite with no schema and no usable session. This
# serves a production *bundle*, not a production *environment*.
#
# Note this overlaps with docker-compose.server-only.yml, which drops webpack for
# the integration suite. Kept separate because each is used on its own.
services:
  app:
    command: pnpm run server-dev
    volumes:
      - ./dist:/usr/src/gogovsg/dist
